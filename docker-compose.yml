services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB:       ecommerce_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application ───────────────────────────────────────────────────────────
  app:
    build: .
    container_name: ecommerce-app
    ports:
      - "8080:8080"
    environment:
      DB_URL:       jdbc:postgresql://postgres:5432/ecommerce_db
      DB_USERNAME:  postgres
      DB_PASSWORD:  postgres
      REDIS_HOST:   redis
      REDIS_PORT:   6379
      JWT_SECRET:   "b2chat-ecommerce-very-secret-key-must-be-at-least-256-bits-long-for-hs256"
      JWT_EXPIRATION: 86400000
      MAIL_HOST:     mailhog
      MAIL_PORT:     1025
      MAIL_USERNAME: noreply@b2chat.io
      MAIL_PASSWORD: ""
      NOTIFICATION_ENABLED: "true"
      # MailHog does not require SMTP auth — override application.yml defaults
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── MailHog (local SMTP / email UI) ──────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ecommerce-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025

volumes:
  postgres_data:
